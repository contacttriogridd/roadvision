# Render Blueprint — https://render.com/deploy?repo=https://github.com/contacttriogridd/roadvision
services:
  - type: web
    name: roadvision
    runtime: docker
    plan: free            # 512 MB RAM: RV_LITE drops the Gradio mount (/ui) so the API + web UI fit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "7860"
      - key: RV_WEIGHTS_URL
        value: https://github.com/contacttriogridd/roadvision/releases/download/v1.0
      - key: RV_LITE
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
